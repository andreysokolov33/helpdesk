services:
  app:
    build: .
    image: ${HELPDESK_IMAGE:-helpdesk:latest}
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - helpdesk_logs:/app/logs
      # Legacy: /media/{hash}.webp → ./uploads/
      - ./uploads:/app/uploads
      # Чат ЛК + helpdesk: /media/chat/{user_id}/{ticket_id}/…
      # Должен совпадать с nginx: location /media/chat/ → /opt/www/skystream_chat_media/
      - /opt/www/skystream_chat_media:/app/uploads/chat
    restart: unless-stopped

volumes:
  helpdesk_logs:
